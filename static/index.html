<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopBot</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f2f2f2; }
  #box { max-width: 420px; height: 100vh; margin: auto; display: flex;
         flex-direction: column; background: #fff; }
  #head { background: #2563eb; color: #fff; padding: 14px; font-weight: bold; }
  #msgs { flex: 1; overflow-y: auto; padding: 12px; }
  .m { max-width: 80%; padding: 8px 12px; margin: 6px 0;
       border-radius: 14px; white-space: pre-line; }
  .bot { background: #e5e7eb; }
  .me { background: #2563eb; color: #fff; margin-left: auto; }
  #bar { display: flex; border-top: 1px solid #ddd; }
  #inp { flex: 1; padding: 14px; border: 0; outline: 0; font-size: 16px; }
  #send { padding: 0 18px; border: 0; background: #2563eb; color: #fff; }
</style>
</head>
<body>
<div id="box">
  <div id="head">🛍️ ShopBot</div>
  <div id="msgs"></div>
  <div id="bar">
    <input id="inp" placeholder="Type a message..." autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>
<script>
const API = "/chat";
const msgs = document.getElementById("msgs");
const inp = document.getElementById("inp");

function add(text, who) {
  const d = document.createElement("div");
  d.className = "m " + who;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

async function send() {
  const text = inp.value.trim();
  if (!text) return;
  add(text, "me");
  inp.value = "";
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text})
    });
    const data = await r.json();
    add(data.reply, "bot");
  } catch (e) {
    add("Server not reachable. Please try again.", "bot");
  }
}

document.getElementById("send").onclick = send;
inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
add("Hi! 👋 Ask me about products, orders, shipping, returns or payments.", "bot");
</script>
</body>
</html>
